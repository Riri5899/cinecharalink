  <style>
    body {
      font-family: sans-serif;
      line-height: 1.8;
      padding: 30px;
      max-width: 800px;
      margin: auto;
    }

    h1 {

  </style>

<body>

  <h1>シネキャラリンクとは</h1>

  <p>
    シネキャラリンクは、映画・アニメなどに登場する
    キャラクター情報を検索できるキャラクター情報サイトです。
  </p>

  <h2>サイトの目的</h2>

  <p>
    キャラクターの登場作品、ジャンル、役割、特徴、
    関係性などの情報を整理し、好きなキャラクターを
    見つけやすくすることを目的としています。
  </p>

  <h2>掲載情報について</h2>

  <p>
    当サイトでは、公開されている情報をもとに、
    キャラクター紹介データを作成しています。
  </p>

  <p>
    作品名・キャラクター名などに関する権利は、
    各作品の権利者に帰属します。
  </p>

  <h2>運営方針</h2>

  <p>
    利用者が楽しくキャラクターを探せる、
    分かりやすい情報サイトを目指して更新しています。
  </p>

  <p>
    <a href="index.html">
      シネキャラリンクへ戻る
    </a>
  </p>
