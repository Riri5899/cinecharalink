<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぼくのウェブサイト</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 50px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        button {
            font-size: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🌟 ぼくのウェブサイト</h1>

    <p>こんにちは！ここからサイトを作っていきます。</p>

    <button onclick="alert('ありがとう！🎉')">クリックしてね！</button>

</body>
</html>
